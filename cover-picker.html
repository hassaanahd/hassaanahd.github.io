<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Picker</title>
<style>
:root{--bg:#181818;--line:#333;--text:#e8e8e8;--muted:#9a9a9a;--acc:#EF9F27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 140px}
h1{font-weight:400;font-size:30px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 24px;font-size:14px}
.book{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.head b{font-size:17px;font-weight:500;margin-right:auto}
.head input{background:#111;border:1px solid #444;color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px;width:240px;max-width:100%}
button{background:transparent;color:var(--text);border:1px solid #555;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
button:hover{background:#2a2a2a}
.grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;min-height:150px}
.opt{flex:0 0 auto;width:96px;aspect-ratio:2/3;border-radius:4px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#2a2a2a;position:relative}
.opt img{width:100%;height:100%;object-fit:cover;display:block}
.opt:hover{border-color:#666}
.opt.sel{border-color:var(--acc)}
.opt.sel:after{content:"✓";position:absolute;top:4px;right:4px;background:var(--acc);color:#111;width:20px;height:20px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.none{flex:0 0 auto;width:96px;aspect-ratio:2/3;border-radius:4px;border:2px dashed #444;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;padding:6px}
.none.sel{border-color:var(--acc);color:var(--acc)}
.msg{font-size:13px;color:var(--muted);align-self:center}
.foot{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid var(--line);padding:12px 16px}
.foot .in{max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.foot .count{color:var(--muted);font-size:14px;margin-right:auto}
.foot .go{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600;padding:9px 18px}
textarea{width:100%;height:300px;background:#111;color:#ccc;border:1px solid #444;border-radius:8px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;margin-top:12px;display:none}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--acc);color:#111;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
</style></head>
<body>
<div class="wrap">
<h1>Cover picker</h1>
<p class="lead">Click a cover for each book. "Auto" leaves the page to pick one itself. Edit the search box and press Search if the right edition isn't there. When you're done, copy the updated <code>read.md</code> at the bottom.</p>
<div id="books"></div>
<textarea id="out" readonly></textarea>
</div>
<div class="foot"><div class="in"><span class="count" id="count"></span><button class="go" id="copy">Copy updated read.md</button></div></div>
<div class="toast" id="toast">Copied</div>
<script>
var TEMPLATE="---\nlayout: page\ntitle: Reading List\npermalink: /read/\n---\n\n<link href=\"https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap\" rel=\"stylesheet\">\n\n<style>\n.rl{--sans:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;--serif:\"Source Serif 4\",Georgia,serif;font-family:var(--sans)}\n.rl h2{font-family:var(--sans);font-size:24px;font-weight:400;letter-spacing:-.01em;border-bottom:1px solid #444;padding-bottom:6px;margin:44px 0 18px;display:flex;justify-content:space-between;align-items:baseline}\n.rl h2 small{font-size:13px;color:#9a9a9a}\n.rl .now{display:grid;grid-template-columns:150px 1fr;gap:26px;align-items:center;border:1px solid #333;border-radius:12px;padding:22px}\n.rl .status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#EF9F27;border:1px solid #5a3a10;border-radius:20px;padding:2px 10px}\n.rl .status:before{content:\"\";width:7px;height:7px;border-radius:50%;background:#EF9F27;animation:rlp 1.8s ease-in-out infinite}\n@keyframes rlp{50%{opacity:.25}}\n.rl .now h3{font-family:var(--serif);font-size:28px;font-weight:600;color:#fff;margin:10px 0 0;line-height:1.2}\n.rl .now .by{font-family:var(--serif);font-style:italic;color:#9a9a9a;font-size:17px}\n.rl .prog{display:flex;gap:4px;margin:18px 0 6px}\n.rl .prog span{flex:1;height:6px;border-radius:3px;background:#333}\n.rl .prog .d{background:#EF9F27}\n.rl .prog .c{background:linear-gradient(90deg,#EF9F27 50%,#333 50%)}\n.rl .sm{font-size:13px;color:#9a9a9a}\n.rl .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 18px}\n.rl .book{display:flex;flex-direction:column;gap:8px}\n.rl .cover{position:relative;aspect-ratio:2/3;border-radius:3px 8px 8px 3px;padding:16px 12px 14px 20px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .2s ease}\n.rl .cover:hover{transform:translateY(-4px) rotate(-1deg)}\n.rl .cover:before{content:\"\";position:absolute;left:0;top:0;bottom:0;width:8px;background:rgba(0,0,0,.35)}\n.rl .cover:after{content:\"\";position:absolute;left:8px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.15)}\n.rl .cover .ti{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2}\n.rl .cover .au{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}\n.rl .cover .no{position:absolute;right:10px;top:10px;font-family:var(--serif);font-size:13px;opacity:.6}\n.rl .cap{font-size:13px;color:#9a9a9a;line-height:1.35}\n.rl .cap b{display:block;color:#e8e8e8;font-weight:500;font-size:14px}\n.rl .dune{background:#3a2a10;color:#FAC775}\n.rl .dost{background:#1b2b45;color:#B5D4F4}\n.rl .homer{background:#0f3a2e;color:#9FE1CB}\n.rl .plath{background:#4b1528;color:#F4C0D1}\n.rl .kafka{background:#2c2c2a;color:#D3D1C7}\n.rl .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;transition:opacity .4s ease}\n.rl .cover.has-img img{opacity:1}\n.rl .cover:before,.rl .cover:after{z-index:2}\n.rl .credit{margin-top:28px;font-size:12px;color:#777}\n.rl .credit a{color:#9a9a9a}\n@media (max-width:560px){.rl .now{grid-template-columns:110px 1fr;gap:18px;padding:16px}.rl .now h3{font-size:22px}.rl .shelf{grid-template-columns:repeat(2,1fr)}}\n<\/style>\n\n<div class=\"rl\">\n\n<div class=\"now\">\n<div class=\"cover dune\" data-q=\"heretics of dune herbert\"><span class=\"no\">V<\/span><span class=\"ti\">Heretics of Dune<\/span><span class=\"au\">Frank Herbert<\/span><\/div>\n<div>\n<span class=\"status\">Currently reading<\/span>\n<h3>Heretics of Dune<\/h3>\n<div class=\"by\">Frank Herbert<\/div>\n<div class=\"prog\"><span class=\"d\"><\/span><span class=\"d\"><\/span><span class=\"d\"><\/span><span class=\"d\"><\/span><span class=\"c\"><\/span><span><\/span><\/div>\n<div class=\"sm\">Book 5 of 6 in the Dune Chronicles<\/div>\n<\/div>\n<\/div>\n\n<h2>Finished <small>10 books<\/small><\/h2>\n\n<div class=\"shelf\">\n\n<div class=\"book\"><div class=\"cover dune\" data-q=\"dune frank herbert\"><span class=\"no\">I<\/span><span class=\"ti\">Dune<\/span><span class=\"au\">Frank Herbert<\/span><\/div><div class=\"cap\"><b>Dune<\/b>Frank Herbert<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover dune\" data-q=\"dune messiah herbert\"><span class=\"no\">II<\/span><span class=\"ti\">Dune Messiah<\/span><span class=\"au\">Frank Herbert<\/span><\/div><div class=\"cap\"><b>Dune Messiah<\/b>Frank Herbert<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover dune\" data-q=\"children of dune herbert\"><span class=\"no\">III<\/span><span class=\"ti\">Children of Dune<\/span><span class=\"au\">Frank Herbert<\/span><\/div><div class=\"cap\"><b>Children of Dune<\/b>Frank Herbert<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover dune\" data-q=\"god emperor of dune herbert\"><span class=\"no\">IV<\/span><span class=\"ti\">God Emperor of Dune<\/span><span class=\"au\">Frank Herbert<\/span><\/div><div class=\"cap\"><b>God Emperor of Dune<\/b>Frank Herbert<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover dost\" data-q=\"white nights dostoevsky\"><span class=\"ti\">White Nights<\/span><span class=\"au\">Fyodor Dostoevsky<\/span><\/div><div class=\"cap\"><b>White Nights<\/b>Fyodor Dostoevsky<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover dost\" data-q=\"the meek one dostoevsky\"><span class=\"ti\">The Meek One<\/span><span class=\"au\">Fyodor Dostoevsky<\/span><\/div><div class=\"cap\"><b>The Meek One<\/b>Fyodor Dostoevsky<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover homer\" data-q=\"iliad emily wilson\"><span class=\"ti\">The Iliad<\/span><span class=\"au\">Homer<\/span><\/div><div class=\"cap\"><b>The Iliad<\/b>Homer \u00b7 tr. Emily Wilson<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover homer\" data-q=\"odyssey emily wilson\"><span class=\"ti\">The Odyssey<\/span><span class=\"au\">Homer<\/span><\/div><div class=\"cap\"><b>The Odyssey<\/b>Homer \u00b7 tr. Emily Wilson<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover plath\" data-q=\"the bell jar plath\"><span class=\"ti\">The Bell Jar<\/span><span class=\"au\">Sylvia Plath<\/span><\/div><div class=\"cap\"><b>The Bell Jar<\/b>Sylvia Plath<\/div><\/div>\n\n<div class=\"book\"><div class=\"cover kafka\" data-q=\"metamorphosis kafka\"><span class=\"ti\">The Metamorphosis<\/span><span class=\"au\">Franz Kafka<\/span><\/div><div class=\"cap\"><b>The Metamorphosis<\/b>Franz Kafka<\/div><\/div>\n\n<\/div>\n\n<p class=\"credit\">Covers from <a href=\"https://openlibrary.org\">Open Library<\/a>.<\/p>\n\n<\/div>\n\n<script>\n(function(){\n  var KEY='rl-covers-v1',cache={};\n  try{cache=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}\n  function save(){try{localStorage.setItem(KEY,JSON.stringify(cache))}catch(e){}}\n  function show(el,src){\n    var img=new Image();img.alt='';\n    img.onload=function(){if(img.naturalWidth>10){el.appendChild(img);requestAnimationFrame(function(){el.classList.add('has-img')})}};\n    img.src=src;\n  }\n  document.querySelectorAll('.rl .cover[data-q]').forEach(function(el){\n    var q=el.getAttribute('data-q');\n    if(el.getAttribute('data-cover')){show(el,el.getAttribute('data-cover'));return}\n    if(cache[q]){show(el,cache[q]);return}\n    fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&fields=cover_i&limit=10')\n      .then(function(r){return r.json()})\n      .then(function(j){\n        var d=(j.docs||[]).filter(function(x){return x.cover_i})[0];\n        if(!d)return;\n        cache[q]='https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg';save();show(el,cache[q]);\n      }).catch(function(){});\n  });\n})();\n<\/script>\n";
var books=[];
TEMPLATE.replace(/<div class="cover \w+" data-q="([^"]+)"(?: data-cover="([^"]*)")?>(?:<span class="no">[^<]*<\/span>)?<span class="ti">([^<]+)<\/span>/g,function(m,q,c,t){
  if(!books.some(function(b){return b.q===q}))books.push({q:q,title:t,pick:c||null});
});
var root=document.getElementById('books');
books.forEach(function(b){
  var el=document.createElement('div');el.className='book';
  el.innerHTML='<div class="head"><b></b><input><button>Search</button></div><div class="grid"><span class="msg">Loading covers…</span></div>';
  el.querySelector('b').textContent=b.title;
  var inp=el.querySelector('input');inp.value=b.q;
  el.querySelector('button').onclick=function(){load(b,el,inp.value)};
  inp.onkeydown=function(e){if(e.key==='Enter')load(b,el,inp.value)};
  root.appendChild(el);
  load(b,el,b.q);
});
upd(true);
function j(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
function load(b,el,q){
  var grid=el.querySelector('.grid');grid.innerHTML='<span class="msg">Loading covers…</span>';
  j('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&fields=key,cover_i&limit=8').then(function(s){
    var ids=[],docs=s.docs||[];
    docs.forEach(function(d){if(d.cover_i)ids.push(d.cover_i)});
    return Promise.all(docs.slice(0,2).filter(function(d){return d.key}).map(function(w){
      return j('https://openlibrary.org'+w.key+'/editions.json?limit=150').then(function(e){
        (e.entries||[]).forEach(function(x){(x.covers||[]).forEach(function(c){if(c>0)ids.push(c)})});
      }).catch(function(){});
    })).then(function(){return ids});
  }).then(function(ids){
    ids=ids.filter(function(v,i,a){return a.indexOf(v)===i}).slice(0,60);
    grid.innerHTML='';
    var none=document.createElement('div');none.className='none'+(b.pick?'':' sel');none.textContent='Auto (let the page pick)';
    none.onclick=function(){b.pick=null;mark(grid,none);upd()};
    grid.appendChild(none);
    if(!ids.length){var m=document.createElement('span');m.className='msg';m.textContent='No covers found. Try a different search.';grid.appendChild(m);return}
    ids.forEach(function(id){
      var url='https://covers.openlibrary.org/b/id/'+id+'-M.jpg';
      var o=document.createElement('div');o.className='opt'+(b.pick===url?' sel':'');
      var img=new Image();img.loading='lazy';img.alt='';img.src='https://covers.openlibrary.org/b/id/'+id+'-S.jpg';
      img.onload=function(){if(img.naturalWidth<10)o.remove()};
      img.onerror=function(){o.remove()};
      o.appendChild(img);
      o.onclick=function(){b.pick=url;mark(grid,o);upd()};
      grid.appendChild(o);
    });
  }).catch(function(){grid.innerHTML='<span class="msg">Couldn’t reach Open Library. Check your connection and press Search.</span>'});
}
function mark(grid,el){grid.querySelectorAll('.sel').forEach(function(x){x.classList.remove('sel')});el.classList.add('sel')}
function build(){
  var md=TEMPLATE;
  books.forEach(function(b){
    var re=new RegExp('(data-q="'+b.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'")(?: data-cover="[^"]*")?','g');
    md=md.replace(re,b.pick?'$1 data-cover="'+b.pick+'"':'$1');
  });
  return md;
}
function upd(init){
  var n=books.filter(function(b){return b.pick}).length;
  document.getElementById('count').textContent=n+' of '+books.length+' picked';
  if(init)return;
  var out=document.getElementById('out');out.value=build();out.style.display='block';
}
document.getElementById('copy').onclick=function(){
  var out=document.getElementById('out');out.value=build();out.style.display='block';
  var done=function(){var t=document.getElementById('toast');t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1500)};
  if(navigator.clipboard)navigator.clipboard.writeText(out.value).then(done,function(){out.select();document.execCommand('copy');done()});
  else{out.select();document.execCommand('copy');done()}
};
</script>
</body></html>
